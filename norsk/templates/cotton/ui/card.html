<c-vars title="" subtitle="" />
<section class="card">
  {% if title %}
    <div class="card-header">
      <h2 class="h5 mb-0">{{ title }}</h2>
      {% if subtitle %}
        <p class="fg-3 small mb-0 mt-1">{{ subtitle }}</p>
      {% endif %}
    </div>
  {% endif %}
  <div class="card-body">{{ slot }}</div>
</section>
