{% extends 'base.html' %}
{% load i18n %}

{% block title %}
  {{ block.super }} - {{ lesson.title }} - {% trans 'Upload Materials' %}
{% endblock %}

{% block content %}
  <c-forms.form-page form=form title="{% trans 'Upload Materials' %}" subtitle="{{ lesson.title }}" submit_label="{% trans 'Upload' %}" cancel_url="{% url 'lessons:lesson_detail' lesson.pk %}" cancel_label="{% trans 'Cancel' %}" multipart>
    <p class="fg-3">{% trans 'Select one or more images to add to this lesson.' %}</p>
  </c-forms.form-page>
{% endblock %}
