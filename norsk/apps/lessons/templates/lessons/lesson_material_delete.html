{% extends 'base.html' %}
{% load i18n %}

{% block title %}
  {{ block.super }} - {% trans 'Delete Material' %}
{% endblock %}

{% block content %}
  <c-forms.form-page form=form title="{% trans 'Delete Material' %}" submit_label="{% trans 'Delete Material' %}" cancel_url="{% url 'lessons:lesson_detail' object.lesson.pk %}" cancel_label="{% trans 'Cancel' %}" danger>
    <c-ui.alert theme="danger">
      {% blocktranslate with title=object.title %}Are you sure you want to delete "{{ title }}"? This cannot be undone.{% endblocktranslate %}
    </c-ui.alert>
  </c-forms.form-page>
{% endblock %}
